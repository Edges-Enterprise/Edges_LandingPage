<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mascot campaign card — live preview</title>
<link rel="stylesheet" href="/campaign/preview.css">
<style>
  :root{
    --font-display:'Playfair Display',Georgia,serif;
    --font-sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:radial-gradient(circle at 20% 8%, #2a1a0d, #120a04 62%);
    color:#F5E9D9;min-height:100vh;
  }

  /* ---- Mock dashboard behind the ad, so the overlay reads as an overlay ---- */
  .mock{display:flex;min-height:100vh}
  .mock-side{
    width:240px;flex-shrink:0;border-right:1px solid rgba(201,138,84,.12);
    padding:20px 16px;display:flex;flex-direction:column;gap:12px;
  }
  .mock-side .bar{height:12px;border-radius:6px;background:rgba(245,233,217,.10)}
  .mock-side .bar.brand{background:rgba(201,138,84,.35);width:60%}
  .mock-main{flex:1;min-width:0;padding:20px 24px}
  .mock-main h1{font-family:var(--font-display);font-weight:800;margin:0 0 4px;font-size:1.5rem}
  .mock-main p{margin:0 0 18px;color:#9c826b;font-size:.85rem}
  .mock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .mock-card{height:92px;border-radius:14px;background:rgba(245,233,217,.06);border:1px solid rgba(201,138,84,.14)}
  .mock-panel{height:260px;border-radius:16px;background:rgba(245,233,217,.05);border:1px solid rgba(201,138,84,.14)}
  @media (max-width:767px){ .mock-side{display:none} }

  /* ---- Dev toolbar: sits ABOVE the ad so a store can be picked while it shows ---- */
  .devbar{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:8px 12px;border-radius:999px;
    background:rgba(18,10,4,.86);border:1px solid rgba(201,138,84,.3);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:.78rem;color:#E7C9A6;max-width:calc(100% - 20px);
  }
  .devbar select,.devbar button{
    font:inherit;color:#F5E9D9;background:rgba(245,233,217,.08);
    border:1px solid rgba(201,138,84,.35);border-radius:8px;padding:4px 9px;cursor:pointer;
  }
  .devbar .rate{color:#9c826b}
  .devbar .err{color:#ffb4a2}
  .devbar .reopen{background:rgba(201,138,84,.9);border-color:transparent;color:#1a0f06;font-weight:700}
</style>
</head>
<body>

<!-- The dashboard the ad covers. -->
<div class="mock">
  <aside class="mock-side">
    <div class="bar brand"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </aside>
  <main class="mock-main">
    <h1>Overview</h1>
    <p>Your dashboard, in flow behind the ad.</p>
    <div class="mock-grid">
      <div class="mock-card"></div><div class="mock-card"></div>
      <div class="mock-card"></div><div class="mock-card"></div>
    </div>
    <div class="mock-panel"></div>
  </main>
</div>

<!-- Dev toolbar (above the ad): pick a store, re-open the ad, see the rate. -->
<div class="devbar">
  <label>Store <select id="store"></select></label>
  <button class="reopen" id="reopen" hidden>Show ad again</button>
  <span class="rate" id="rateLine">Fetching the live USD rate…</span>
</div>

<script>
  const USD_REWARD = 10;
  const STORES = [
    { cc:"NG", currency:"NGN", locale:"en-NG", brand:"#C98A54" },
    { cc:"GH", currency:"GHS", locale:"en-GH", brand:"#0879E9" },
    { cc:"KE", currency:"KES", locale:"en-KE", brand:"#792BD5" },
    { cc:"ZA", currency:"ZAR", locale:"en-ZA", brand:"#0E7C66" },
    { cc:"IN", currency:"INR", locale:"en-IN", brand:"#C2185B" },
    { cc:"US", currency:"USD", locale:"en-US", brand:"#00A95C" }
  ];
  const FALLBACK = { NGN:1600, GHS:15.2, KES:129, ZAR:18.3, INR:83.4, USD:1 };
  const fmt = (v,c,l) => new Intl.NumberFormat(l,{style:"currency",currency:c,maximumFractionDigits:2}).format(v);

  let rates = FALLBACK;

  /** The card exactly as the React component renders it, wrapped in the scrim. */
  function overlayMarkup(store) {
    const rate = rates[store.currency] ?? FALLBACK[store.currency] ?? 1;
    const isUsd = store.currency === "USD";
    const local = isUsd ? null : USD_REWARD * rate;
    const conversion = local === null ? "" : `
        <p class="campaign-conversion">
          <span class="campaign-conversion__value">${fmt(local, store.currency, store.locale)}</span>
          <span class="campaign-conversion__caption">at today's rate &middot; ${store.currency}</span>
        </p>`;
    return `
    <div class="campaign-ad-overlay">
      <div class="first-deposit-campaign" style="--brand-color:${store.brand}">
        <article class="goat-campaign-card">
          <button type="button" class="campaign-close" aria-label="Dismiss"><span aria-hidden="true">&#215;</span></button>
          <div class="campaign-panel" aria-hidden="true">
            <div class="campaign-atmosphere"></div>
            <div class="campaign-orb campaign-orb--one"></div>
            <div class="campaign-orb campaign-orb--two"></div>
          </div>
          <div class="campaign-mascot" aria-hidden="true" style="--mascot-url:url(/campaign/goat-mascot.webp)">
            <div class="campaign-mascot__glow"></div>
            <img class="campaign-mascot__image" src="/campaign/goat-mascot.webp" alt="">
            <span class="campaign-mascot__grade"></span>
          </div>
          <div class="campaign-content">
            <span class="campaign-eyebrow">LIMITED-TIME OFFER</span>
            <h2 class="campaign-title">
              <span class="campaign-title__line">DEPOSIT IN THE APP.</span>
              <span class="campaign-hero">
                <span class="campaign-hero__word">GET</span>
                <span class="campaign-amount-wrap">
                  <span class="campaign-flare" aria-hidden="true"></span>
                  <span class="campaign-amount">$10</span>
                  <i class="campaign-spark campaign-spark--a" aria-hidden="true"></i>
                  <i class="campaign-spark campaign-spark--b" aria-hidden="true"></i>
                  <i class="campaign-spark campaign-spark--c" aria-hidden="true"></i>
                </span>
                <span class="campaign-hero__word">FREE.</span>
              </span>
            </h2>
            ${conversion}
            <div class="campaign-benefits">
              <div class="campaign-benefit">&#9889; Instant top-up</div>
              <div class="campaign-benefit">&#127873; Bonus credit</div>
              <div class="campaign-benefit">&#128274; Secure deposit</div>
            </div>
            <button class="campaign-cta"><span class="campaign-cta__label">Deposit now</span> <span class="campaign-cta__arrow">&#8594;</span></button>
          </div>
        </article>
      </div>
    </div>`;
  }

  let current = null;
  function showAd() {
    if (current) current.remove();
    const store = STORES[Number(document.getElementById("store").value) || 0];
    const tpl = document.createElement("div");
    tpl.innerHTML = overlayMarkup(store).trim();
    current = tpl.firstElementChild;
    document.body.appendChild(current);
    document.getElementById("reopen").hidden = true;
  }

  function dismissAd() {
    if (current) current.remove();
    current = null;
    document.getElementById("reopen").hidden = false;
  }

  // The X dismisses; so does a click on the scrim (anywhere outside the card).
  document.addEventListener("click", (e) => {
    if (!current || !current.contains(e.target)) return;
    if (e.target.closest(".campaign-close") || !e.target.closest(".goat-campaign-card")) {
      dismissAd();
    }
  });

  document.getElementById("store").innerHTML =
    STORES.map((s, i) => `<option value="${i}">${s.cc} &middot; ${s.currency}</option>`).join("");
  document.getElementById("store").addEventListener("change", showAd);
  document.getElementById("reopen").addEventListener("click", showAd);

  // Show the ad over the mock dashboard straight away, like the dashboard does.
  showAd();

  fetch("https://api.exchangerate-api.com/v4/latest/USD", { cache:"no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((data) => {
      if (data && data.rates) { rates = data.rates; showAd(); }
      const stamp = data.date ? ` (published ${data.date})` : "";
      document.getElementById("rateLine").innerHTML = `Live rates${stamp}`;
    })
    .catch(() => {
      document.getElementById("rateLine").innerHTML =
        `<span class="err">Rate API unreachable — sample rates.</span>`;
    });
</script>
</body>
</html>
